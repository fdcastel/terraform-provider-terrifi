name: CI - UOS Probe

# Probe-only workflow (issue #157 / improvement-plan §8 L04). Proves that a
# UniFi OS Server install + bootstrap survives on a github-hosted
# ubuntu-24.04 runner. Does NOT run `go test` — that is L05's job.
#
# ┌─ STATUS: BLOCKED (do not rely on this passing yet) ───────────────────┐
# │ The full install→bootstrap chain is validated locally on a Proxmox    │
# │ LXC (UOS 5.1.15, 92/92 acceptance tests). On github-hosted runners    │
# │ the UOS installer's rootless-podman steps resolve the invoking user   │
# │ to the runner's `runner` account (via audit loginuid / cwd owner —    │
# │ immutable under sudo, unaffected by `systemd-run --scope`) and target │
# │ /home/runner/.config/<subsystem>, which the `uosserver` service user  │
# │ cannot traverse or write. Five layered workarounds (exec bit, sudo    │
# │ HOME, SUDO_USER/LOGNAME, storage.conf traversal, bundled-pasta        │
# │ helper_binaries_dir) each cleared one subsystem and surfaced the      │
# │ next (cni, …). The installer is built for a bare-root host and is not │
# │ cleanly CI-compatible. Unblock paths: self-hosted root runner (like   │
# │ ci-hil), a pre-baked UOS VM image, or keep `uos` a local-only target. │
# └───────────────────────────────────────────────────────────────────────┘
#
# Trigger: workflow_dispatch only. Run it by hand from the Actions tab.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe UOS Server install + bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@v4

      - name: Install prerequisites (podman, slirp4netns, curl, jq)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          start=$(date +%s)
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            podman slirp4netns curl jq ca-certificates
          echo "podman: $(podman --version)"
          echo "slirp4netns: $(slirp4netns --version | head -1)"
          echo "::notice title=Phase timing::prereqs took $(( $(date +%s) - start ))s"

      - name: Prime runner container config for UOS's rootless podman
        timeout-minutes: 1
        run: |
          set -euo pipefail
          # The UOS installer derives the "invoking user" from the runner's
          # loginuid (immutable, = runner) regardless of SUDO_USER/HOME, so its
          # image-load podman reads config from /home/runner/.config/containers
          # rather than the uosserver user's home. Two consequences to patch:
          #
          #  1. storage.conf stat fails ("permission denied") because the path
          #     sits under a 0700 home the uosserver service user can't
          #     traverse. Open read+traverse and drop a minimal storage.conf.
          #
          #  2. Without UOS's containers.conf here, podman falls back to the
          #     runner's *system* /usr/bin/pasta (an old version that rejects
          #     UOS's --map-host-loopback args and dies printing usage). UOS
          #     ships a newer bundled pasta at /var/lib/uosserver/bin (laid down
          #     before the image-load step), so point helper_binaries_dir there.
          sudo mkdir -p /home/runner/.config/containers
          printf '[storage]\ndriver = "overlay"\n' | sudo tee /home/runner/.config/containers/storage.conf >/dev/null
          printf '[engine]\nhelper_binaries_dir = ["/var/lib/uosserver/bin"]\n' | sudo tee /home/runner/.config/containers/containers.conf >/dev/null
          sudo chmod a+rx /home/runner /home/runner/.config /home/runner/.config/containers
          sudo chmod a+r /home/runner/.config/containers/storage.conf /home/runner/.config/containers/containers.conf

      - name: Install UOS Server (pinned 5.1.15)
        timeout-minutes: 12
        run: |
          set -euo pipefail
          start=$(date +%s)
          # Run the installer inside a systemd transient scope. The installer
          # resolves the "invoking user" from the audit loginuid, which is
          # immutable (= runner) under a normal sudo session and makes its
          # rootless-podman steps target /home/runner (root-owned, 0700 — the
          # uosserver service user can neither traverse nor write it). A
          # systemd-run --scope child is spawned by systemd (PID 1), so it
          # inherits an *unset* loginuid and the installer resolves to root,
          # using /root + /home/uosserver as on the dev host.
          sudo systemd-run --scope --quiet --unit=uos-install bash testing/install-uos-server.sh
          echo "::notice title=Phase timing::install took $(( $(date +%s) - start ))s"

      - name: Verify service is active
        timeout-minutes: 2
        run: |
          set -euo pipefail
          systemctl is-active uosserver
          echo "version: $(uosserver version 2>/dev/null | head -1)"

      - name: Verify /api/system responds
        timeout-minutes: 3
        run: |
          set -euo pipefail
          start=$(date +%s)
          deadline=$(( start + 120 ))
          until curl -fsSk -o /dev/null -w '%{http_code}\n' https://127.0.0.1:11443/api/system; do
            [ "$(date +%s)" -lt "$deadline" ] || { echo "ERROR: /api/system never returned 2xx"; exit 1; }
            sleep 2
          done
          echo "::notice title=Phase timing::api-warmup took $(( $(date +%s) - start ))s"

      - name: Run bootstrap.sh
        timeout-minutes: 5
        run: |
          set -euo pipefail
          start=$(date +%s)
          # Capture the UNIFI_* output but do not export it anywhere (no tests run).
          # -H for the same HOME=/root reason as the install step.
          out=$(sudo -H bash testing/bootstrap.sh)
          echo "$out" | sed 's/UNIFI_API_KEY=.*/UNIFI_API_KEY=***redacted***/'
          echo "$out" | grep -q '^UNIFI_API_KEY=' || { echo "ERROR: bootstrap produced no API key"; exit 1; }
          echo "::notice title=Phase timing::bootstrap took $(( $(date +%s) - start ))s"

      - name: Dump uosserver journal on failure
        if: failure()
        run: |
          echo "=== systemctl status ==="
          systemctl status uosserver --no-pager || true
          echo "=== journalctl (last 200 lines) ==="
          sudo journalctl -u uosserver --no-pager -n 200 || true
